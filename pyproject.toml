[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-toolkit"
version = "0.1.0"
description = "Reusable workflow templates for AI-assisted software development"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ganghu Xie" }]
keywords = ["ai", "workflow", "automation", "developer-tools", "prompts"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ai-workflow = "ai_workflow_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/ganghuxie/ai-workflow-toolkit"
Issues = "https://github.com/ganghuxie/ai-workflow-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
